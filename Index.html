<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sanjeet Kumar | Cybersecurity</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
            line-height: 1.6;
        }

        header {
            background: #0b3d91;
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        header h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 18px;
        }

        nav {
            background: white;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 8px #ddd;
            position: sticky;
            top: 0;
        }

        nav a {
            color: #0b3d91;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 40px 20px;
        }

        section {
            background: white;
            margin-bottom: 25px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        h2 {
            color: #0b3d91;
            margin-bottom: 15px;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .skill {
            background: #e8f0ff;
            color: #0b3d91;
            padding: 8px 15px;
            border-radius: 20px;
        }

        .buttons a {
            display: inline-block;
            margin: 8px 8px 0 0;
            padding: 10px 18px;
            background: #0b3d91;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .buttons a:hover {
            background: #062b68;
        }

        footer {
            text-align: center;
            background: #0b3d91;
            color: white;
            padding: 20px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 32px;
            }

            nav a {
                margin: 0 7px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Sanjeet Kumar</h1>
