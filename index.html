<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get the Course — ₹20</title>
  <style>
    body {
      background: #0b0f19; color: #eef2f8;
      font-family: system-ui, Arial, sans-serif;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;
    }
    .box {
      background: #151d2e; border: 1px solid #23304a;
      border-radius: 16px; padding: 32px 24px;
      max-width: 440px; width: 100%; text-align: center;
    }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    .price { font-size: 2rem; font-weight: 800; color: #2aabee; margin: 12px 0; }
    p  { color: #9aa7bd; margin: 0 0 20px; font-size: 0.92rem; line-height: 1.5; }
    a.pay-btn {
      display: block; width: 100%; padding: 15px;
      border-radius: 10px; background: #2aabee; color: white;
      font-weight: bold; font-size: 1rem;
      text-decoration: none; margin-bottom: 12px;
      box-sizing: border-box;
    }
    a.pay-btn:hover { background: #1d8fd0; }
    .upi-box {
      background: #0d1421; border: 1px solid #23304a;
      border-radius: 10px; padding: 12px;
      font-family: monospace; font-size: 0.95rem;
      word-break: break-all; margin-bottom: 12px; color: #eef2f8;
    }
    .qr { background: white; padding: 12px; border-radius: 10px; display: inline-block; margin-bottom: 16px; }
    .step { text-align: left; color: #9aa7bd; font-size: 0.88rem; margin: 4px 0; }
    .step b { color: #eef2f8; }
    a.send-btn {
      display: block; width: 100%; padding: 15px; margin-top: 16px;
      border-radius: 10px; background: #22c55e; color: white;
      font-weight: bold; font-size: 1rem; text-decoration: none;
      box-sizing: border-box;
    }
    a.send-btn:hover { background: #16a34a; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Get the full course</h1>
    <div class="price">₹20</div>
    <p>Pay ₹20 with any UPI app, then send us the screenshot on Telegram. We'll let you in within minutes.</p>

    <a class="pay-btn"
       href="upi://pay?pa=6207982061@ybl&pn=My%20Course&am=20&cu=INR&tn=Course%20Access">
      Pay ₹20 with UPI app
    </a>

    <div class="upi-box">6207982061@ybl</div>

    <div class="qr">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=upi%3A%2F%2Fpay%3Fpa%3D6207982061%40ybl%26pn%3DMy%2520Course%26am%3D20%26cu%3DINR"
           alt="UPI QR" width="180" height="180">
    </div>

    <div class="step"><b>1.</b> Pay ₹20 with any UPI app</div>
    <div class="step"><b>2.</b> Screenshot the payment</div>
    <div class="step"><b>3.</b> Tap the green button and send it</div>

    <a class="send-btn" href="https://t.me/YOUR_USERNAME">
      Send screenshot on Telegram
    </a>
  </div>
</body>
</html>
